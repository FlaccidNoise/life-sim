<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>ecosim — phase 1</title>
    <style>
      /* One frosted-glass panel system over a dark canvas. Monospace + one cyan accent — this is a
         data-dense sim/debug tool, so numeric alignment and a terminal identity matter. */
      :root {
        --bg: #0a0e14;
        --panel: rgba(12, 17, 24, 0.66);
        --border: rgba(120, 170, 210, 0.16);
        --text: #c9d6e2;
        --muted: #6b7a8d;
        --accent: #8ad9f2;
        --radius: 7px;
        --shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
        --blur: blur(9px);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font:
          12px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
      }
      .panel {
        position: fixed;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        backdrop-filter: var(--blur);
        -webkit-backdrop-filter: var(--blur);
        padding: 12px;
      }
      #left {
        top: 14px;
        left: 14px;
        width: 280px;
      }
      #right {
        top: 14px;
        right: 14px;
        width: 280px;
      }
      h1 {
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 10px;
      }
      h2 {
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 14px 0 6px;
      }
      .muted {
        color: var(--muted);
      }
      .ctl-row {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .btn {
        background: rgba(120, 170, 210, 0.1);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 5px 9px;
        cursor: pointer;
        font: inherit;
      }
      .btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .lbl {
        color: var(--muted);
      }
      .num {
        background: rgba(0, 0, 0, 0.3);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 4px 6px;
        width: 64px;
        font: inherit;
      }
      .status {
        margin-top: 6px;
        font-size: 11px;
        word-break: break-all;
      }
      .knob {
        margin-bottom: 10px;
      }
      .knob-head {
        display: flex;
        justify-content: space-between;
        margin-bottom: 3px;
      }
      .knob-val {
        color: var(--accent);
      }
      .slider {
        width: 100%;
        accent-color: var(--accent);
      }
      #graph {
        width: 100%;
        height: 120px;
        display: block;
        border-radius: 5px;
      }
      #inspector .row {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid rgba(120, 170, 210, 0.06);
        padding: 1px 0;
      }
      #inspector .k {
        color: var(--muted);
      }
      #inspector .v {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="left" class="panel">
      <h1>ecosim · phase 1</h1>
      <div id="hud-body" class="muted">
        physics — soft repulsion + integration, toroidal, deterministic.
      </div>
      <h2>controls</h2>
      <div id="controls"></div>
      <h2>knobs</h2>
      <div id="knobs"></div>
    </div>

    <div id="right" class="panel">
      <h2>population</h2>
      <canvas id="graph"></canvas>
      <h2>inspector</h2>
      <div id="inspector"></div>
    </div>

    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
