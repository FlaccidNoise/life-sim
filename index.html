<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>ecosim — archipelago</title>
    <style>
      /* One frosted-glass panel system over a dark canvas. Monospace + one cyan accent — this is a
         data-dense sim/debug tool, so numeric alignment and a terminal identity matter.

         LAYOUT MODEL (desktop): the canvas is the full-screen hero. Floating over it —
           • top-centre   : the TRANSPORT bar (time controls + live status)
           • left         : the SELECTED-CREATURE dossier (brain keystone → genes → morphotype)
           • right        : the WORLD panel (population graph + distributions + world stats)
           • bottom-left  : menu buttons (⚙ settings · ❔ guide) that summon modal sheets
           • bottom-centre: the VIEW chips (food layer / color mode / flow / walls / overlay / glow)
           • bottom-right : the dot legend (closeable)                                                  */
      :root {
        --bg: #0a0e14;
        --panel: rgba(12, 17, 24, 0.66);
        --panel-solid: rgba(11, 15, 21, 0.94);
        --border: rgba(120, 170, 210, 0.16);
        --border-hi: rgba(138, 217, 242, 0.5);
        --text: #c9d6e2;
        --muted: #6b7a8d;
        --accent: #8ad9f2;
        --accent-dim: rgba(138, 217, 242, 0.14);
        --danger: #e08a8a;
        --radius: 7px;
        --shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
        --shadow-lg: 0 18px 60px rgba(0, 0, 0, 0.6);
        --blur: blur(9px);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font:
          12px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
      }
      .panel {
        position: fixed;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        backdrop-filter: var(--blur);
        -webkit-backdrop-filter: var(--blur);
        padding: 12px;
        max-height: calc(100vh - 86px); /* clear the top bar + bottom chrome */
        overflow-y: auto;
      }
      #left {
        top: 60px; /* sits UNDER the top transport bar */
        left: 14px;
        width: 280px;
        z-index: 10;
      }
      #right {
        top: 60px;
        right: 14px;
        width: 292px;
        z-index: 10;
      }
      h2 {
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 14px 0 6px;
      }
      h2:first-child {
        margin-top: 0;
      }
      h3 {
        font-size: 10px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 12px 0 5px;
      }
      .muted {
        color: var(--muted);
      }
      .ctl-row {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .btn {
        background: rgba(120, 170, 210, 0.1);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 5px 9px;
        cursor: pointer;
        font: inherit;
      }
      .btn:hover,
      .btn:focus-visible {
        border-color: var(--accent);
        color: var(--accent);
        outline: none;
      }
      .btn.active {
        border-color: var(--border-hi);
        color: var(--accent);
        background: var(--accent-dim);
      }
      .lbl {
        color: var(--muted);
      }
      .num {
        background: rgba(0, 0, 0, 0.3);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 4px 6px;
        width: 64px;
        font: inherit;
      }
      .num:focus-visible {
        outline: none;
        border-color: var(--accent);
      }
      .status {
        font-size: 11px;
        word-break: break-all;
      }

      /* ── Top transport bar ─────────────────────────────────────────────────────────────────────── */
      #topbar {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 15;
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        backdrop-filter: var(--blur);
        -webkit-backdrop-filter: var(--blur);
        padding: 7px 12px;
        max-width: calc(100vw - 28px);
      }
      #topbar .tb-row {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      #topbar .btn {
        padding: 5px 11px;
      }
      #topbar .num,
      #topbar select.num {
        width: auto;
        padding: 4px 8px;
      }
      .tb-sep {
        width: 1px;
        align-self: stretch;
        background: var(--border);
      }
      .tb-stat {
        display: flex;
        flex-direction: column;
        line-height: 1.35;
        font-size: 11px;
        white-space: nowrap;
      }
      .tb-stat .tb-perf {
        color: var(--muted);
        font-size: 10px;
      }

      /* ── Knobs (slider list — rendered into the settings modal) ──────────────────────────────────── */
      .knob {
        margin-bottom: 10px;
      }
      .knob-head {
        display: flex;
        justify-content: space-between;
        margin-bottom: 3px;
      }
      .knob-val {
        color: var(--accent);
      }
      .slider {
        width: 100%;
        accent-color: var(--accent);
      }
      .knob.toggle {
        display: flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
        margin-bottom: 10px;
      }
      .knob.toggle .check {
        accent-color: var(--accent);
        margin: 0;
      }

      /* ── Selected-creature dossier (left) ────────────────────────────────────────────────────────── */
      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
      }
      .empty {
        text-align: center;
        padding: 30px 8px;
        font-size: 11px;
        opacity: 0.8;
      }
      #brain {
        width: 100%;
        height: 210px;
        display: block;
        border-radius: 5px;
        background: rgba(0, 0, 0, 0.22);
      }
      #radar {
        width: 100%;
        height: 200px;
        display: block;
        border-radius: 5px;
      }
      #radar-lens {
        width: 100%;
        margin-bottom: 6px;
        background: rgba(0, 0, 0, 0.3);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 4px 6px;
        font: inherit;
      }
      #inspector .row {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid rgba(120, 170, 210, 0.06);
        padding: 1px 0;
      }
      #inspector .k {
        color: var(--muted);
      }
      #inspector .v {
        color: var(--text);
      }
      #follow-status {
        font-size: 10px;
        text-align: right;
        max-width: 150px;
      }

      /* ── World panel (right) ─────────────────────────────────────────────────────────────────────── */
      #graph {
        width: 100%;
        height: 120px;
        display: block;
        border-radius: 5px;
      }
      #dist {
        width: 100%;
        height: 220px;
        display: block;
        border-radius: 5px;
      }
      #world-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px 14px;
        margin-bottom: 4px;
      }
      #world-stats .ws {
        display: flex;
        justify-content: space-between;
        gap: 6px;
        font-size: 11px;
        border-bottom: 1px solid rgba(120, 170, 210, 0.06);
        padding: 1px 0;
      }
      #world-stats .ws-k {
        color: var(--muted);
      }
      #world-stats .ws-v {
        color: var(--text);
      }
      /* Interactive population-graph legend: click a series to toggle it on the chart. */
      #graph-legend {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 6px;
        font-size: 10px;
      }
      .gl-item {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        user-select: none;
        opacity: 0.95;
      }
      .gl-item.off {
        opacity: 0.4;
        text-decoration: line-through;
      }
      .gl-dot {
        width: 9px;
        height: 9px;
        border-radius: 2px;
        flex: 0 0 auto;
      }
      .dist-pick {
        margin-bottom: 6px;
        font-size: 11px;
      }
      .dist-pick > summary {
        color: var(--muted);
        cursor: pointer;
        list-style: none;
        user-select: none;
      }
      .dist-pick > summary:hover {
        color: var(--accent);
      }
      .dist-pick[open] > summary {
        color: var(--accent);
      }
      .dist-fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px 10px;
        margin-top: 6px;
        max-height: 210px;
        overflow-y: auto;
      }
      .dist-fields label {
        display: flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
        white-space: nowrap;
      }
      .dist-fields input {
        accent-color: var(--accent);
        margin: 0;
      }
      .dist-sw {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        flex: 0 0 auto;
      }

      /* ── Bottom-left menu buttons ────────────────────────────────────────────────────────────────── */
      #menu-buttons {
        position: fixed;
        left: 14px;
        bottom: 14px;
        z-index: 12;
        display: flex;
        gap: 8px;
      }
      .menu-btn {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        backdrop-filter: var(--blur);
        -webkit-backdrop-filter: var(--blur);
        color: var(--text);
        padding: 9px 14px;
        cursor: pointer;
        font: inherit;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        transition:
          border-color 0.18s ease,
          color 0.18s ease;
      }
      .menu-btn:hover,
      .menu-btn:focus-visible {
        color: var(--accent);
        border-color: var(--border-hi);
        outline: none;
      }

      /* ── Bottom-centre view chips ────────────────────────────────────────────────────────────────── */
      #view-chips {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 14px;
        z-index: 11;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: center;
        max-width: calc(100vw - 380px); /* stay clear of the corner clusters */
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 999px;
        box-shadow: var(--shadow);
        backdrop-filter: var(--blur);
        -webkit-backdrop-filter: var(--blur);
        color: var(--muted);
        padding: 5px 11px;
        cursor: pointer;
        font: inherit;
        font-size: 11px;
        white-space: nowrap;
        transition:
          border-color 0.16s ease,
          color 0.16s ease,
          background 0.16s ease;
      }
      .chip:hover,
      .chip:focus-visible {
        color: var(--accent);
        border-color: var(--border-hi);
        outline: none;
      }
      .chip.active {
        color: var(--accent);
        border-color: var(--border-hi);
        background: var(--accent-dim);
      }
      .chip .chip-v {
        color: var(--text);
      }
      .chip.active .chip-v {
        color: var(--accent);
      }

      /* ── Dot legend (bottom-right) ───────────────────────────────────────────────────────────────── */
      #legend-panel {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 54px; /* rise above the view chips, over the open canvas — clear of both side panels */
        width: 280px;
        z-index: 13;
        font-size: 11px;
        line-height: 1.5;
      }
      #legend-pill {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 54px;
        z-index: 13;
        display: none;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        backdrop-filter: var(--blur);
        -webkit-backdrop-filter: var(--blur);
        color: var(--muted);
        padding: 6px 11px;
        cursor: pointer;
        font: inherit;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #legend-pill:hover,
      #legend-pill:focus-visible {
        color: var(--accent);
        border-color: var(--accent);
        outline: none;
      }
      .lg-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 7px;
      }
      .lg-x {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        padding: 0 2px;
        line-height: 1;
      }
      .lg-x:hover {
        color: var(--accent);
      }
      .lg-row {
        margin-bottom: 5px;
      }
      .lg-row b {
        color: var(--text);
      }
      .lg-gl {
        color: var(--text);
        margin-left: 4px;
      }
      .lg-tri {
        font-size: 9px;
      }
      .lg-cl {
        color: var(--accent);
      }
      .lg-na {
        opacity: 0.4;
        text-decoration: line-through;
      }
      .lg-bar {
        height: 7px;
        border-radius: 3px;
        margin-top: 3px;
      }
      .lg-satbar {
        background: linear-gradient(90deg, #5a6470, #2fd0e8);
      }
      .lg-valbar {
        background: linear-gradient(90deg, #14202c, #cfe8f5);
      }

      /* ── Family-tree (lineage) modal — opened from the creature dossier 🌳 button or 't' ──────────── */
      #lineage-panel {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 300px;
        max-height: 72vh;
        overflow-y: auto;
        z-index: 22; /* above side panels (z 10) + chips (z 11) + topbar (z 15), below the overlays (z 40) */
        display: none;
        font-size: 11px;
        line-height: 1.5;
      }
      .insp-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .ln-btn {
        font-size: 10px;
        padding: 2px 7px;
        text-transform: none;
        letter-spacing: 0;
      }
      .ln-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .ln-x {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        padding: 0 2px;
        line-height: 1;
      }
      .ln-x:hover {
        color: var(--accent);
      }
      .ln-sec {
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 10px;
        margin: 10px 0 5px;
      }
      .ln-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 5px;
        border-radius: 4px;
        border: 1px solid transparent;
      }
      .ln-live {
        cursor: pointer;
      }
      .ln-live:hover {
        border-color: var(--border);
        background: rgba(120, 170, 210, 0.08);
      }
      .ln-sel {
        border-color: var(--accent);
        background: rgba(120, 170, 210, 0.14);
      }
      .ln-sw {
        width: 11px;
        height: 11px;
        border-radius: 3px;
        flex: 0 0 auto;
      }
      .ln-gl {
        color: var(--text);
      }
      .ln-id {
        color: var(--text);
        min-width: 38px;
      }
      .ln-gen,
      .ln-bt {
        color: var(--muted);
      }
      .ln-dead {
        color: var(--danger);
      }
      .ln-conn {
        color: var(--muted);
        padding-left: 9px;
        line-height: 1;
        height: 9px;
      }
      .ln-foot {
        margin-top: 9px;
        font-size: 10px;
        word-break: break-all;
      }

      /* Narrow screens: the centre chips + legend collide with the side panels — hide the floating
         extras rather than overlap. */
      @media (max-width: 980px) {
        #legend-panel,
        #legend-pill {
          display: none !important;
        }
        #view-chips {
          max-width: calc(100vw - 28px);
        }
      }

      /* ── Modal sheets (settings · guide) ─────────────────────────────────────────────────────────── */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(5, 8, 12, 0.55);
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        padding: 24px;
        animation: overlay-in 0.18s ease;
      }
      .overlay[hidden] {
        display: none;
      }
      @keyframes overlay-in {
        from {
          opacity: 0;
        }
      }
      .modal {
        background: var(--panel-solid);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: var(--shadow-lg);
        backdrop-filter: var(--blur);
        -webkit-backdrop-filter: var(--blur);
        width: 100%;
        max-width: 560px;
        max-height: calc(100vh - 48px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        animation: modal-in 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      @keyframes modal-in {
        from {
          transform: translateY(8px);
          opacity: 0;
        }
      }
      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
      }
      .modal-head h2 {
        margin: 0;
        font-size: 12px;
        color: var(--accent);
        letter-spacing: 0.12em;
      }
      .modal-x {
        background: none;
        border: 1px solid transparent;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        line-height: 1;
        padding: 4px 8px;
        border-radius: 5px;
      }
      .modal-x:hover,
      .modal-x:focus-visible {
        color: var(--accent);
        border-color: var(--border-hi);
        outline: none;
      }
      .modal-tabs {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        padding: 10px 16px 0;
      }
      .tab {
        background: rgba(120, 170, 210, 0.07);
        border: 1px solid var(--border);
        border-radius: 6px 6px 0 0;
        border-bottom: none;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 11px;
        padding: 6px 11px;
        letter-spacing: 0.04em;
      }
      .tab:hover,
      .tab:focus-visible {
        color: var(--accent);
        outline: none;
      }
      .tab.active {
        color: var(--accent);
        border-color: var(--border-hi);
        background: var(--accent-dim);
      }
      .modal-body {
        padding: 14px 16px;
        overflow-y: auto;
        flex: 1;
      }
      .modal-foot {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-top: 1px solid var(--border);
        flex-wrap: wrap;
      }
      .modal-foot label {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
      }
      .group-hint {
        color: var(--muted);
        font-size: 10px;
        margin-bottom: 12px;
        line-height: 1.5;
      }
      /* Guide modal content. */
      .guide-sec {
        margin-bottom: 18px;
      }
      .guide-sec:last-child {
        margin-bottom: 0;
      }
      .guide-sec h3 {
        color: var(--accent);
        margin-top: 0;
      }
      .guide-lead {
        color: var(--text);
        margin-bottom: 14px;
        line-height: 1.6;
      }
      .key-grid {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 12px;
        align-items: baseline;
      }
      kbd {
        display: inline-block;
        min-width: 16px;
        text-align: center;
        background: rgba(120, 170, 210, 0.12);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 6px;
        color: var(--accent);
        font: inherit;
        font-size: 11px;
        white-space: nowrap;
      }

      /* ──────────────────────────────────────────────────────────────────────────────────────────
         MANUAL mobile / desktop modes. No auto-detection — the user flips #mode-toggle and the choice
         is remembered (localStorage). Desktop = floating panels + bars. Mobile = the canvas stays the
         full-screen hero, panels become bottom sheets summoned from a fixed action bar, touch targets grow.
         ────────────────────────────────────────────────────────────────────────────────────────── */
      #mode-toggle {
        background: rgba(120, 170, 210, 0.1);
        border: 1px solid var(--border);
        border-radius: 5px;
        color: var(--muted);
        padding: 5px 9px;
        cursor: pointer;
        font: inherit;
        font-size: 11px;
        white-space: nowrap;
      }
      #mode-toggle:hover,
      #mode-toggle:focus-visible {
        color: var(--accent);
        border-color: var(--accent);
        outline: none;
      }
      #mbar {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        gap: 8px;
        padding: 9px 11px calc(9px + env(safe-area-inset-bottom, 0px));
        background: var(--panel);
        border-top: 1px solid var(--border);
        backdrop-filter: var(--blur);
        -webkit-backdrop-filter: var(--blur);
      }
      #mbar .mbtn {
        flex: 1;
        min-height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: rgba(120, 170, 210, 0.1);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font: inherit;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        cursor: pointer;
      }
      #mbar .mbtn:focus-visible {
        outline: none;
        border-color: var(--accent);
        color: var(--accent);
      }
      #mbar .mbtn.active {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-dim);
      }
      #mbar #mbar-play {
        flex: 0 0 24%;
      }

      body.mode-mobile #mbar {
        display: flex;
      }
      /* Mobile hides the desktop-only floating chrome; play lives on the action bar, settings/guide are
         reachable from it, view toggles move into the world sheet. */
      body.mode-mobile #topbar,
      body.mode-mobile #menu-buttons,
      body.mode-mobile #view-chips {
        display: none !important;
      }
      body.mode-mobile #left,
      body.mode-mobile #right {
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        width: auto;
        max-width: 560px;
        margin: 0 auto;
        max-height: 74vh;
        border-radius: var(--radius) var(--radius) 0 0;
        padding-bottom: 78px;
        transform: translateY(105%);
        transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 14;
      }
      body.mode-mobile #left.sheet-open,
      body.mode-mobile #right.sheet-open {
        transform: translateY(0);
      }
      body.mode-mobile .btn {
        min-height: 40px;
        padding: 9px 12px;
      }
      body.mode-mobile .slider {
        height: 26px;
      }
      body.mode-mobile .num {
        min-height: 36px;
      }
      body.mode-mobile #legend-panel,
      body.mode-mobile #legend-pill {
        display: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        body.mode-mobile #left,
        body.mode-mobile #right {
          transition: none;
        }
        .overlay,
        .modal {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>

    <!-- Boot-fatal banner (renderer init failure) — replaces the old in-panel error slot. -->
    <div
      id="fatal"
      class="panel"
      hidden
      style="top: 14px; left: 14px; max-width: 480px; z-index: 50"
    ></div>

    <!-- TOP: transport / time controls (Controls renders into #controls) -->
    <header id="topbar" aria-label="Time controls">
      <div id="controls" class="tb-row"></div>
      <div class="tb-sep"></div>
      <button id="mode-toggle" aria-label="Toggle mobile / desktop layout">📱 mobile</button>
    </header>

    <!-- LEFT: selected-creature dossier (brain keystone → genes → morphotype) -->
    <aside id="left" class="panel" aria-label="Selected creature">
      <div class="panel-head">
        <h2>selected creature</h2>
        <span id="follow-status" class="muted"></span>
      </div>
      <div id="creature-empty" class="muted empty">click any dot in the world to inspect it</div>
      <div id="creature-body" hidden>
        <h3>brain</h3>
        <canvas id="brain"></canvas>
        <h3>state &amp; genes</h3>
        <div id="inspector"></div>
        <h3>morphotype</h3>
        <select id="radar-lens"></select>
        <canvas id="radar"></canvas>
        <div class="ctl-row" style="margin-top: 10px">
          <button id="follow-btn" class="btn" title="follow + record this creature (l)">
            🔒 follow
          </button>
          <button id="lineage-open" class="btn" title="family tree (t)">🌳 tree</button>
          <button id="csv-btn" class="btn" title="download the followed creature's per-tick CSV">
            ⤓ csv
          </button>
        </div>
      </div>
    </aside>

    <!-- RIGHT: world panel (global stats + population + distributions) -->
    <aside id="right" class="panel" aria-label="World statistics">
      <h2>world</h2>
      <div id="world-stats"></div>
      <h2>population</h2>
      <canvas id="graph"></canvas>
      <div id="graph-legend"></div>
      <h2>distributions</h2>
      <details id="dist-pick" class="dist-pick">
        <summary>fields ▾</summary>
        <div id="dist-fields" class="dist-fields"></div>
      </details>
      <canvas id="dist"></canvas>
    </aside>

    <!-- BOTTOM-LEFT: menu buttons -->
    <div id="menu-buttons">
      <button id="open-settings" class="menu-btn">⚙ settings</button>
      <button id="open-guide" class="menu-btn">❔ guide</button>
    </div>

    <!-- BOTTOM-CENTRE: view chips (render/overlay toggles) -->
    <div id="view-chips" aria-label="View toggles"></div>

    <!-- BOTTOM-RIGHT: dot legend -->
    <div id="legend-panel" class="panel"></div>
    <button id="legend-pill">legend</button>

    <!-- Family-tree modal (centered overlay) -->
    <div id="lineage-panel" class="panel"></div>

    <!-- Settings modal -->
    <div id="settings-overlay" class="overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-label="Settings">
        <div class="modal-head">
          <h2>settings</h2>
          <button class="modal-x" data-close="settings" aria-label="Close settings">✕</button>
        </div>
        <div id="settings-tabs" class="modal-tabs"></div>
        <div id="settings-body" class="modal-body"></div>
        <div class="modal-foot">
          <label>seed <input id="modal-seed" class="num" type="number" /></label>
          <button id="launch-world" class="btn">↺ launch new world</button>
          <span class="muted" style="flex: 1; text-align: right; font-size: 10px">
            <b class="lbl">*</b> = applied on new world · others live
          </span>
        </div>
      </div>
    </div>

    <!-- Guide modal -->
    <div id="guide-overlay" class="overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-label="Guide">
        <div class="modal-head">
          <h2>guide &amp; controls</h2>
          <button class="modal-x" data-close="guide" aria-label="Close guide">✕</button>
        </div>
        <div id="guide-body" class="modal-body"></div>
      </div>
    </div>

    <!-- Mobile-only action bar: always-on play + summon sheets + settings. -->
    <nav id="mbar" aria-label="Mobile controls">
      <button id="mbar-play" class="mbtn" aria-label="Play or pause">▶</button>
      <button id="mbar-controls" class="mbtn" aria-pressed="false">🔬 creature</button>
      <button id="mbar-stats" class="mbtn" aria-pressed="false">📊 world</button>
      <button id="mbar-settings" class="mbtn">⚙</button>
    </nav>

    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
