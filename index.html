<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>life-sim</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #0a0e14;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        font: 12px monospace;
        color: #9fe;
        background: rgba(0, 0, 0, 0.4);
        padding: 4px 8px;
        border-radius: 4px;
        white-space: pre;
        pointer-events: none;
      }
      #telemetry {
        position: fixed;
        top: 8px;
        right: 8px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.4);
      }
      #inspect {
        position: fixed;
        bottom: 8px;
        left: 8px;
        font: 12px monospace;
        color: #fe9;
        background: rgba(0, 0, 0, 0.4);
        padding: 4px 8px;
        border-radius: 4px;
        white-space: pre;
        pointer-events: none;
      }
      #controls {
        position: fixed;
        bottom: 8px;
        right: 8px;
        font: 11px monospace;
        color: #9fe;
        background: rgba(0, 0, 0, 0.45);
        padding: 6px 8px;
        border-radius: 4px;
        max-height: 45vh;
        overflow: auto;
      }
      #controls input[type='range'] {
        width: 120px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <canvas id="telemetry" width="280" height="240"></canvas>
    <div id="inspect">click a cell to inspect</div>
    <canvas
      id="brain"
      width="280"
      height="200"
      style="
        position: absolute;
        right: 8px;
        bottom: 8px;
        background: rgba(8, 10, 16, 0.85);
        border: 1px solid #234;
        display: none;
      "
    ></canvas>
    <div id="controls"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
