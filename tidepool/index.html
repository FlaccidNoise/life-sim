<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Tidepool</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #04121c;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: grid;
        place-items: center;
        color: #cfe6ee;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      .panel {
        max-width: 32rem;
        margin: 1rem;
        padding: 1.5rem 2rem;
        border-radius: 12px;
        background: rgb(4 18 28 / 0.9);
        text-align: center;
        pointer-events: auto;
      }
      .panel[role='alert'] {
        border: 1px solid #3b6377;
      }
      .panel button {
        padding: 0.5rem 1.5rem;
        border: 0;
        border-radius: 8px;
        background: #cfe6ee;
        color: #04121c;
        font: inherit;
        cursor: pointer;
      }
      .readout,
      .bench {
        position: fixed;
        left: 12px;
        margin: 0;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgb(4 18 28 / 0.75);
      }
      .readout {
        top: 12px;
        font:
          12px/1.4 ui-monospace,
          monospace;
      }
      .bench {
        bottom: 12px;
        max-width: calc(100% - 44px);
      }
      .hint {
        position: fixed;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        width: max-content;
        max-width: calc(100% - 32px);
        margin: 0;
        padding: 6px 14px;
        border-radius: 18px;
        background: rgb(4 18 28 / 0.75);
        text-align: center;
      }
      .hint small {
        display: block;
        font-size: 0.8em;
        opacity: 0.8;
      }
      .leave {
        position: fixed;
        top: 12px;
        right: 12px;
        min-width: 44px;
        min-height: 44px;
        padding: 0 14px;
        border: 1px solid #3b6377;
        border-radius: 8px;
        background: rgb(4 18 28 / 0.75);
        color: inherit;
        font: inherit;
        cursor: pointer;
        pointer-events: auto;
      }
      .leave:focus-visible {
        outline: 2px solid #cfe6ee;
        outline-offset: 2px;
      }
      .leave:disabled {
        opacity: 0.6;
        cursor: default;
      }
      /* A beat of the walkthrough points at a control: one pulse. With motion off, a steady ring
         for as long as the beat shows. */
      .pulse {
        box-shadow: 0 0 0 2px #cfe6ee;
      }
      @media (prefers-reduced-motion: no-preference) {
        .pulse {
          box-shadow: none;
          animation: pulse 1.8s ease-out;
        }
        @keyframes pulse {
          from {
            box-shadow: 0 0 0 0 rgb(207 230 238 / 0.9);
          }
          to {
            box-shadow: 0 0 0 16px rgb(207 230 238 / 0);
          }
        }
      }
      .leave kbd {
        margin-left: 4px;
        font:
          12px ui-monospace,
          monospace;
        opacity: 0.7;
      }
      /* A narrow screen has no room for the key, and a touch screen has no key. */
      @media (max-width: 40rem), (pointer: coarse) {
        .leave kbd {
          display: none;
        }
      }
      .death {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        box-sizing: border-box;
        width: min(40rem, calc(100% - 32px));
        max-height: 40%;
        overflow-y: auto;
        margin: 0 auto 16px;
        padding: 12px 16px;
        border: 1px solid #3b6377;
        border-radius: 12px;
        background: rgb(4 18 28 / 0.9);
        text-align: center;
        pointer-events: auto;
      }
      /* An open note makes the overlay taller: the cause and the last button stay on the screen. */
      .death:has(.note) {
        max-height: 60%;
      }
      .death p {
        margin: 0;
      }
      .death-cause {
        font-weight: 600;
      }
      .death-gone {
        color: #f0b27a;
      }
      /* The cause, under the heirs: the first death leads with the line that goes on. */
      .death .death-after {
        margin-bottom: 8px;
        opacity: 0.8;
      }
      .heirs {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin: 8px 0;
      }
      .death button {
        min-width: 44px;
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
      }
      .death .watch {
        padding: 0.5rem 1.5rem;
        background: #cfe6ee;
        color: #04121c;
      }
      .death .heir {
        display: grid;
        gap: 6px;
        flex: 1 1 8.5rem;
        max-width: 11rem;
        padding: 6px 10px;
        background: #12384d;
        color: inherit;
        text-align: left;
      }
      .death .heir:hover,
      .death .heir:focus-visible {
        background: #1c5370;
      }
      .death button:focus-visible {
        outline: 2px solid #cfe6ee;
        outline-offset: 2px;
      }
      .heir-top {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .swatch {
        flex: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 1px solid rgb(207 230 238 / 0.6);
      }
      .energy {
        display: block;
        height: 6px;
        border-radius: 3px;
        background: rgb(207 230 238 / 0.2);
        overflow: hidden;
      }
      .energy > span {
        display: block;
        height: 100%;
        background: #7fd1a8;
      }
      /* The bud card: beside the body, which is at the centre of the screen in Play. It takes no
         pointer, so a click on it goes to the water. */
      .bud {
        position: fixed;
        top: 50%;
        right: calc(50% + 96px);
        transform: translateY(-50%);
        box-sizing: border-box;
        width: 18rem;
        padding: 8px 12px 10px;
        border: 1px solid #3b6377;
        border-radius: 12px;
        background: rgb(4 18 28 / 0.85);
        font-size: 13px;
        line-height: 1.4;
      }
      .bud p,
      .bud ul,
      .bud figure {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .bud-head {
        font-size: 14px;
        font-weight: 600;
      }
      .bud-pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 4px 0;
        font-size: 12px;
        text-align: center;
      }
      .bud svg {
        display: block;
        width: 100%;
        max-width: 8rem;
        margin: 0 auto;
        color: #cfe6ee;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .bud figcaption {
        opacity: 0.75;
      }
      /* The mark of a difference, on a part and on the side of its line: the parent is on the left. */
      .bud .marked,
      .bud li::before {
        color: #f0b27a;
      }
      .bud li {
        position: relative;
        padding: 0 14px;
      }
      .bud li.child {
        text-align: right;
      }
      .bud li.parent::before,
      .bud li.child::before {
        content: '';
        position: absolute;
        top: 0.5em;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .bud li.parent::before {
        left: 0;
      }
      .bud li.child::before {
        right: 0;
      }
      .bud .bud-note {
        margin-top: 2px;
        font-size: 12px;
        opacity: 0.7;
      }
      /* No room beside the body: the card is under the buttons at the top, above the body. */
      @media (max-width: 50rem) {
        .bud {
          top: 68px;
          left: 50%;
          right: auto;
          transform: translateX(-50%);
          width: min(19rem, calc(100% - 24px));
        }
        .bud svg {
          max-width: 6rem;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .bud {
          animation: bud-in 200ms ease-out;
        }
        @keyframes bud-in {
          from {
            opacity: 0;
          }
        }
      }
      .corner {
        position: fixed;
        top: 12px;
        right: 12px;
        display: flex;
        gap: 8px;
      }
      .corner .leave {
        position: static;
      }
      .brain-toggle[aria-pressed='true'] {
        border-color: #cfe6ee;
        background: #12384d;
      }
      .brain {
        position: fixed;
        top: 68px;
        right: 12px;
        box-sizing: border-box;
        width: min(26rem, calc(100% - 24px));
        padding: 10px 14px 12px;
        border: 1px solid #3b6377;
        border-radius: 12px;
        background: rgb(4 18 28 / 0.9);
        font-size: 13px;
        line-height: 1.4;
        pointer-events: auto;
      }
      .brain header {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brain h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      .brain-count {
        flex: 1;
        font-size: 12px;
        opacity: 0.7;
      }
      .brain-close {
        width: 32px;
        height: 32px;
        margin-left: auto;
        border: 0;
        border-radius: 8px;
        background: none;
        color: inherit;
        font: inherit;
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
      }
      .brain-close:hover {
        background: #12384d;
      }
      .brain-close:focus-visible {
        outline: 2px solid #cfe6ee;
        outline-offset: 2px;
      }
      .brain p {
        margin: 4px 0 0;
      }
      .brain canvas {
        display: block;
        width: 100%;
        height: clamp(200px, 40vh, 320px);
        margin-top: 6px;
      }
      .brain-state {
        padding: 28px 8px 32px;
        font-size: 15px;
        text-align: center;
      }
      .brain-state small {
        display: block;
        margin-top: 6px;
        font-size: 12px;
        opacity: 0.7;
        overflow-wrap: anywhere;
      }
      .brain-state summary {
        margin-top: 6px;
        font-size: 12px;
        opacity: 0.7;
        cursor: pointer;
      }
      .brain-path {
        min-height: 2.8em;
        font-weight: 600;
      }
      .brain-mode {
        font-weight: 600;
      }
      .brain-changes b {
        font-variant-numeric: tabular-nums;
      }
      .brain-mode span,
      .brain-key {
        font-size: 12px;
        font-weight: 400;
        opacity: 0.75;
      }
      .brain i {
        display: inline-block;
        box-sizing: border-box;
        margin: 0 5px 0 10px;
        vertical-align: middle;
      }
      .brain i:first-child {
        margin-left: 0;
      }
      .brain .wire {
        width: 14px;
        height: 3px;
        border-radius: 2px;
      }
      .brain .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #cfe6ee;
      }
      .brain .ring {
        width: 13px;
        height: 13px;
        border: 2px solid #fff;
        border-radius: 50%;
      }
      .brain .quiet {
        width: 10px;
        height: 10px;
        border: 1px solid #3b6377;
        border-radius: 50%;
      }
      @media (max-width: 40rem) {
        .brain {
          top: auto;
          left: 0;
          right: 0;
          bottom: 0;
          width: auto;
          max-height: 46%;
          overflow-y: auto;
          border-width: 1px 0 0;
          border-radius: 12px 12px 0 0;
        }
        .brain canvas {
          height: clamp(140px, 24vh, 200px);
        }
        .brain-close {
          width: 44px;
          height: 44px;
          margin-block: -6px;
        }
        #ui:has(.brain) {
          --foot: 60%;
        }
        /* The raised line is where the bud card is. The card is a line of the page too, and it
           leaves in 6 seconds: the line is not drawn under it. */
        #ui:has(.brain):has(.bud) .hint {
          display: none;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .brain {
          animation: brain-in 160ms ease-out;
        }
        @keyframes brain-in {
          from {
            opacity: 0;
            transform: translateY(8px);
          }
        }
      }
      /* A note: the "?" mark on the thing that it explains, and the note, open in place. */
      button.mark {
        position: relative;
        box-sizing: border-box;
        width: 20px;
        min-width: 0;
        height: 20px;
        min-height: 0;
        margin: 0 0 0 4px;
        padding: 0;
        border: 1px solid #3b6377;
        border-radius: 50%;
        background: rgb(4 18 28 / 0.75);
        color: inherit;
        font:
          600 12px/1 system-ui,
          sans-serif;
        vertical-align: middle;
        cursor: pointer;
        pointer-events: auto;
      }
      /* A finger gets 44 pixels. */
      button.mark::after {
        content: '';
        position: absolute;
        inset: -12px;
      }
      button.mark:hover,
      button.mark[aria-expanded='true'] {
        border-color: #cfe6ee;
        background: #12384d;
      }
      button.mark:focus-visible,
      button.note-more:focus-visible,
      .guide button:focus-visible {
        outline: 2px solid #cfe6ee;
        outline-offset: 2px;
      }
      .note {
        display: block;
        box-sizing: border-box;
        max-width: 22rem;
        margin: 6px 0 4px;
        padding: 8px 12px;
        border-left: 2px solid #7fd1a8;
        border-radius: 0 8px 8px 0;
        background: #0b2a3b;
        font-size: 13px;
        font-weight: 400;
        line-height: 1.5;
        text-align: left;
        pointer-events: auto;
      }
      .death .note {
        margin-inline: auto;
      }
      button.note-more {
        min-width: 0;
        min-height: 0;
        margin-left: 6px;
        padding: 0;
        border: 0;
        background: none;
        color: #7fd1a8;
        font: inherit;
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
      }
      /* The descendants counter: top left, and under the debug readout when there is one. */
      .score {
        top: 12px;
        bottom: auto;
      }
      .score.low {
        top: 100px;
      }
      .score .note {
        max-width: 17rem;
      }
      /* The open note of the counter is over the bud card where the two meet. */
      .score:has(.note) {
        z-index: 1;
        background: #04121c;
      }
      /* A narrow screen has no room for the counter beside three buttons: it is under them, and
         the bud card is under it. */
      @media (max-width: 40rem) {
        .score {
          top: 64px;
        }
        .score.low {
          top: 152px;
        }
        .bud {
          top: 108px;
        }
        /* `?debug`: the buttons leave the readout its corner, the copy button is under them, and
           the bud card is under the counter. */
        .readout ~ .corner {
          flex-wrap: wrap;
          justify-content: flex-end;
          max-width: calc(100% - 150px);
        }
        .corner .walklog {
          order: 1;
        }
        .score.low ~ .bud {
          top: 196px;
        }
      }
      /* The field guide: a modal dialog over the water, which runs on behind it. */
      .guide {
        box-sizing: border-box;
        width: min(54rem, calc(100% - 32px));
        max-width: none;
        height: min(48rem, calc(100% - 32px));
        max-height: none;
        padding: 0;
        border: 1px solid #3b6377;
        border-radius: 14px;
        background: #05151f;
        color: #cfe6ee;
        font:
          16px/1.7 system-ui,
          sans-serif;
        overflow: hidden;
        pointer-events: auto;
      }
      .guide[open] {
        display: grid;
        grid-template: auto 1fr / 15rem 1fr;
      }
      .guide::backdrop {
        background: rgb(4 18 28 / 0.35);
      }
      .guide header {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px 10px 22px;
        border-bottom: 1px solid rgb(59 99 119 / 0.6);
      }
      .guide h2 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
      }
      .guide header p {
        flex: 1;
        margin: 0;
        font-size: 13px;
        opacity: 0.7;
      }
      .guide nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 14px 10px;
        border-right: 1px solid rgb(59 99 119 / 0.6);
        overflow-y: auto;
      }
      .guide nav button {
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-height: 42px;
        padding: 8px 12px;
        border: 0;
        border-radius: 8px;
        background: none;
        color: inherit;
        font: inherit;
        font-size: 14px;
        line-height: 1.35;
        text-align: left;
        cursor: pointer;
        opacity: 0.75;
      }
      .guide nav b {
        flex: none;
        width: 1.1em;
        color: #7fd1a8;
        font-weight: 600;
      }
      .guide nav button:hover {
        background: rgb(18 56 77 / 0.6);
        opacity: 1;
      }
      .guide nav button[aria-current] {
        background: #12384d;
        opacity: 1;
      }
      .guide article {
        padding: 24px 34px 28px;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .guide article > * {
        max-width: 34rem;
      }
      .guide-n,
      .guide-live h4,
      .guide footer small {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .guide-n,
      .guide-live h4 {
        margin: 0;
        color: #7fd1a8;
      }
      .guide h3 {
        margin: 2px 0 14px;
        font-size: 26px;
        font-weight: 600;
        line-height: 1.2;
      }
      .guide article p {
        margin: 0 0 14px;
      }
      .guide-live {
        margin-top: 22px;
        padding: 12px 16px 14px;
        border: 1px solid #3b6377;
        border-radius: 12px;
        background: rgb(18 56 77 / 0.35);
        font-size: 14px;
        line-height: 1.5;
      }
      .guide-live h4 {
        margin-bottom: 8px;
      }
      .guide-live h5 {
        margin: 14px 0 4px;
        font-size: 13px;
        font-weight: 600;
      }
      .guide-live h5:first-of-type {
        margin-top: 0;
      }
      .guide .guide-live p {
        margin: 0;
        opacity: 0.8;
      }
      .guide dl,
      .guide dd {
        margin: 0;
      }
      .guide-rows div {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 3px 0;
        border-bottom: 1px solid rgb(59 99 119 / 0.35);
      }
      .guide-rows div:last-child {
        border: 0;
      }
      .guide-rows dd {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .guide-terms div {
        padding: 10px 0;
        border-bottom: 1px solid rgb(59 99 119 / 0.35);
      }
      .guide-terms dt {
        font-weight: 600;
      }
      .guide-terms dd {
        opacity: 0.85;
      }
      /* The last bud, in chapter 3: the card with no frame of its own. */
      .guide .guide-bud {
        position: static;
        width: auto;
        max-width: 20rem;
        padding: 0;
        border: 0;
        background: none;
        transform: none;
        animation: none;
      }
      .guide footer {
        display: flex;
        gap: 10px;
        margin-top: 24px;
      }
      .guide footer button {
        display: grid;
        flex: 1;
        min-height: 52px;
        padding: 8px 14px;
        border: 1px solid #3b6377;
        border-radius: 10px;
        background: none;
        color: inherit;
        font: inherit;
        font-size: 15px;
        line-height: 1.3;
        text-align: left;
        cursor: pointer;
      }
      .guide footer small {
        opacity: 0.7;
      }
      .guide footer .guide-next {
        background: #12384d;
        text-align: right;
      }
      .guide footer button:hover {
        border-color: #cfe6ee;
      }
      /* A narrow screen: a sheet from the foot, with the chapters in one row that scrolls. */
      @media (max-width: 44rem) {
        .guide {
          width: 100%;
          height: min(88dvh, calc(100% - 40px));
          margin: auto 0 0;
          border-width: 1px 0 0;
          border-radius: 16px 16px 0 0;
        }
        .guide[open] {
          grid-template: auto auto 1fr / 1fr;
        }
        .guide header {
          padding-left: 18px;
        }
        .guide nav {
          flex-direction: row;
          padding: 8px 12px;
          border-right: 0;
          border-bottom: 1px solid rgb(59 99 119 / 0.6);
          overflow: auto hidden;
          scroll-padding-inline: 12px;
          scrollbar-width: none;
        }
        .guide nav button {
          flex: none;
          gap: 6px;
          min-height: 44px;
          white-space: nowrap;
        }
        .guide article {
          padding: 18px 18px 28px;
        }
        .guide h3 {
          font-size: 23px;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .guide[open] {
          animation: guide-in 180ms ease-out;
        }
        @keyframes guide-in {
          from {
            opacity: 0;
            transform: translateY(10px);
          }
        }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
