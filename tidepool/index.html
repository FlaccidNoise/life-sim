<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Tidepool</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #04121c;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: grid;
        place-items: center;
        color: #cfe6ee;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      .panel {
        max-width: 32rem;
        margin: 1rem;
        padding: 1.5rem 2rem;
        border-radius: 12px;
        background: rgb(4 18 28 / 0.9);
        text-align: center;
        pointer-events: auto;
      }
      .panel[role='alert'] {
        border: 1px solid #3b6377;
      }
      .panel button {
        padding: 0.5rem 1.5rem;
        border: 0;
        border-radius: 8px;
        background: #cfe6ee;
        color: #04121c;
        font: inherit;
        cursor: pointer;
      }
      .readout,
      .bench {
        position: fixed;
        left: 12px;
        margin: 0;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgb(4 18 28 / 0.75);
      }
      .readout {
        top: 12px;
        font:
          12px/1.4 ui-monospace,
          monospace;
      }
      .bench {
        bottom: 12px;
        max-width: calc(100% - 44px);
      }
      .hint {
        position: fixed;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        width: max-content;
        max-width: calc(100% - 32px);
        margin: 0;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgb(4 18 28 / 0.75);
        text-align: center;
      }
      .death {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        box-sizing: border-box;
        width: min(40rem, calc(100% - 32px));
        max-height: 40%;
        overflow-y: auto;
        margin: 0 auto 16px;
        padding: 12px 16px;
        border: 1px solid #3b6377;
        border-radius: 12px;
        background: rgb(4 18 28 / 0.9);
        text-align: center;
        pointer-events: auto;
      }
      .death p {
        margin: 0;
      }
      .death-cause {
        font-weight: 600;
      }
      .death-gone {
        color: #f0b27a;
      }
      .heirs {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin: 8px 0;
      }
      .death button {
        min-width: 44px;
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
      }
      .death .watch {
        padding: 0.5rem 1.5rem;
        background: #cfe6ee;
        color: #04121c;
      }
      .death .heir {
        display: grid;
        gap: 6px;
        flex: 1 1 8.5rem;
        max-width: 11rem;
        padding: 6px 10px;
        background: #12384d;
        color: inherit;
        text-align: left;
      }
      .death .heir:hover,
      .death .heir:focus-visible {
        background: #1c5370;
      }
      .death button:focus-visible {
        outline: 2px solid #cfe6ee;
        outline-offset: 2px;
      }
      .heir-top {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .swatch {
        flex: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 1px solid rgb(207 230 238 / 0.6);
      }
      .energy {
        display: block;
        height: 6px;
        border-radius: 3px;
        background: rgb(207 230 238 / 0.2);
        overflow: hidden;
      }
      .energy > span {
        display: block;
        height: 100%;
        background: #7fd1a8;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
