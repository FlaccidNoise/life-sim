<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Tidepool</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #04121c;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: grid;
        place-items: center;
        color: #cfe6ee;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      .panel {
        max-width: 32rem;
        margin: 1rem;
        padding: 1.5rem 2rem;
        border-radius: 12px;
        background: rgb(4 18 28 / 0.9);
        text-align: center;
        pointer-events: auto;
      }
      .panel[role='alert'] {
        border: 1px solid #3b6377;
      }
      .panel button {
        padding: 0.5rem 1.5rem;
        border: 0;
        border-radius: 8px;
        background: #cfe6ee;
        color: #04121c;
        font: inherit;
        cursor: pointer;
      }
      .readout,
      .bench {
        position: fixed;
        left: 12px;
        margin: 0;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgb(4 18 28 / 0.75);
      }
      .readout {
        top: 12px;
        font:
          12px/1.4 ui-monospace,
          monospace;
      }
      .bench {
        bottom: 12px;
        max-width: calc(100% - 44px);
      }
      .hint {
        position: fixed;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        width: max-content;
        max-width: calc(100% - 32px);
        margin: 0;
        padding: 6px 14px;
        border-radius: 18px;
        background: rgb(4 18 28 / 0.75);
        text-align: center;
      }
      .hint small {
        display: block;
        font-size: 0.8em;
        opacity: 0.8;
      }
      .leave {
        position: fixed;
        top: 12px;
        right: 12px;
        min-width: 44px;
        min-height: 44px;
        padding: 0 14px;
        border: 1px solid #3b6377;
        border-radius: 8px;
        background: rgb(4 18 28 / 0.75);
        color: inherit;
        font: inherit;
        cursor: pointer;
        pointer-events: auto;
      }
      .leave:focus-visible {
        outline: 2px solid #cfe6ee;
        outline-offset: 2px;
      }
      .leave:disabled {
        opacity: 0.6;
        cursor: default;
      }
      /* A beat of the walkthrough points at a control: one pulse. With motion off, a steady ring
         for as long as the beat shows. */
      .pulse {
        box-shadow: 0 0 0 2px #cfe6ee;
      }
      @media (prefers-reduced-motion: no-preference) {
        .pulse {
          box-shadow: none;
          animation: pulse 1.8s ease-out;
        }
        @keyframes pulse {
          from {
            box-shadow: 0 0 0 0 rgb(207 230 238 / 0.9);
          }
          to {
            box-shadow: 0 0 0 16px rgb(207 230 238 / 0);
          }
        }
      }
      .leave kbd {
        margin-left: 4px;
        font:
          12px ui-monospace,
          monospace;
        opacity: 0.7;
      }
      /* A narrow screen has no room for the key, and a touch screen has no key. */
      @media (max-width: 40rem), (pointer: coarse) {
        .leave kbd {
          display: none;
        }
      }
      .death {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        box-sizing: border-box;
        width: min(40rem, calc(100% - 32px));
        max-height: 40%;
        overflow-y: auto;
        margin: 0 auto 16px;
        padding: 12px 16px;
        border: 1px solid #3b6377;
        border-radius: 12px;
        background: rgb(4 18 28 / 0.9);
        text-align: center;
        pointer-events: auto;
      }
      .death p {
        margin: 0;
      }
      .death-cause {
        font-weight: 600;
      }
      .death-gone {
        color: #f0b27a;
      }
      .heirs {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin: 8px 0;
      }
      .death button {
        min-width: 44px;
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
      }
      .death .watch {
        padding: 0.5rem 1.5rem;
        background: #cfe6ee;
        color: #04121c;
      }
      .death .heir {
        display: grid;
        gap: 6px;
        flex: 1 1 8.5rem;
        max-width: 11rem;
        padding: 6px 10px;
        background: #12384d;
        color: inherit;
        text-align: left;
      }
      .death .heir:hover,
      .death .heir:focus-visible {
        background: #1c5370;
      }
      .death button:focus-visible {
        outline: 2px solid #cfe6ee;
        outline-offset: 2px;
      }
      .heir-top {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .swatch {
        flex: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 1px solid rgb(207 230 238 / 0.6);
      }
      .energy {
        display: block;
        height: 6px;
        border-radius: 3px;
        background: rgb(207 230 238 / 0.2);
        overflow: hidden;
      }
      .energy > span {
        display: block;
        height: 100%;
        background: #7fd1a8;
      }
      .corner {
        position: fixed;
        top: 12px;
        right: 12px;
        display: flex;
        gap: 8px;
      }
      .corner .leave {
        position: static;
      }
      .brain-toggle[aria-pressed='true'] {
        border-color: #cfe6ee;
        background: #12384d;
      }
      .brain {
        position: fixed;
        top: 68px;
        right: 12px;
        box-sizing: border-box;
        width: min(26rem, calc(100% - 24px));
        padding: 10px 14px 12px;
        border: 1px solid #3b6377;
        border-radius: 12px;
        background: rgb(4 18 28 / 0.9);
        font-size: 13px;
        line-height: 1.4;
        pointer-events: auto;
      }
      .brain header {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brain h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      .brain-count {
        flex: 1;
        font-size: 12px;
        opacity: 0.7;
      }
      .brain-close {
        width: 32px;
        height: 32px;
        margin-left: auto;
        border: 0;
        border-radius: 8px;
        background: none;
        color: inherit;
        font: inherit;
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
      }
      .brain-close:hover {
        background: #12384d;
      }
      .brain-close:focus-visible {
        outline: 2px solid #cfe6ee;
        outline-offset: 2px;
      }
      .brain p {
        margin: 4px 0 0;
      }
      .brain canvas {
        display: block;
        width: 100%;
        height: clamp(200px, 40vh, 320px);
        margin-top: 6px;
      }
      .brain-state {
        padding: 28px 8px 32px;
        font-size: 15px;
        text-align: center;
      }
      .brain-state small {
        display: block;
        margin-top: 6px;
        font-size: 12px;
        opacity: 0.7;
        overflow-wrap: anywhere;
      }
      .brain-state summary {
        margin-top: 6px;
        font-size: 12px;
        opacity: 0.7;
        cursor: pointer;
      }
      .brain-path {
        min-height: 2.8em;
        font-weight: 600;
      }
      .brain-mode {
        font-weight: 600;
      }
      .brain-changes b {
        font-variant-numeric: tabular-nums;
      }
      .brain-mode span,
      .brain-key {
        font-size: 12px;
        font-weight: 400;
        opacity: 0.75;
      }
      .brain i {
        display: inline-block;
        box-sizing: border-box;
        margin: 0 5px 0 10px;
        vertical-align: middle;
      }
      .brain i:first-child {
        margin-left: 0;
      }
      .brain .wire {
        width: 14px;
        height: 3px;
        border-radius: 2px;
      }
      .brain .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #cfe6ee;
      }
      .brain .ring {
        width: 13px;
        height: 13px;
        border: 2px solid #fff;
        border-radius: 50%;
      }
      .brain .quiet {
        width: 10px;
        height: 10px;
        border: 1px solid #3b6377;
        border-radius: 50%;
      }
      @media (max-width: 40rem) {
        .brain {
          top: auto;
          left: 0;
          right: 0;
          bottom: 0;
          width: auto;
          max-height: 46%;
          overflow-y: auto;
          border-width: 1px 0 0;
          border-radius: 12px 12px 0 0;
        }
        .brain canvas {
          height: clamp(140px, 24vh, 200px);
        }
        .brain-close {
          width: 44px;
          height: 44px;
          margin-block: -6px;
        }
        #ui:has(.brain) {
          --foot: 60%;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .brain {
          animation: brain-in 160ms ease-out;
        }
        @keyframes brain-in {
          from {
            opacity: 0;
            transform: translateY(8px);
          }
        }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
