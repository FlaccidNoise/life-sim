name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # test:all, NOT test. The default `pnpm test` excludes world.test.ts, world.phero.test.ts and
      # harness.test.ts for fast local iteration — and those are exactly the files that assert the
      # determinism contract (same config + seed → identical stateHash), the project's only invariant.
      # Running `pnpm test` here left that contract unverified on every push.
      - run: pnpm test:all
